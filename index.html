<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roadtrip App</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b998b">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #0f172a;
    --card: #1a2740;
    --card-border: #2a3a5c;
    --text: #e2e8f0;
    --muted: #93a3b8;
    --accent: #1b998b;
    --accent-2: #2dd4bf;
    --danger: #f2545b;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 40px;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: linear-gradient(180deg, #0f172a 80%, transparent);
    padding: 16px 16px 8px;
  }
  header input[type="text"], header input[type="date"] {
    background: transparent;
    border: none;
    color: var(--text);
    font-weight: 700;
    width: 100%;
    padding: 4px 0;
  }
  #tripName {
    font-size: 1.4rem;
  }
  #tripDate {
    font-size: 0.9rem;
    color: var(--muted);
  }
  .totals {
    display: flex;
    gap: 16px;
    margin-top: 8px;
    font-size: 0.85rem;
    color: var(--accent-2);
    font-weight: 600;
  }
  nav.tabs {
    display: flex;
    gap: 8px;
    padding: 8px 16px;
    position: sticky;
    top: 84px;
    z-index: 9;
    background: var(--bg);
  }
  nav.tabs button {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--muted);
    padding: 10px 6px;
    border-radius: 10px;
    font-size: 0.85rem;
    cursor: pointer;
  }
  nav.tabs button.active {
    background: var(--accent);
    color: #05201c;
    border-color: var(--accent);
    font-weight: 700;
  }
  main {
    padding: 8px 16px 16px;
  }
  .tab { display: none; }
  .tab.active { display: block; }
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .card-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .card-row.two > * { flex: 1; min-width: 0; }
  .card label {
    display: block;
    font-size: 0.7rem;
    color: var(--muted);
    margin-bottom: 3px;
  }
  .card input, .card textarea {
    width: 100%;
    background: #101c33;
    border: 1px solid var(--card-border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px;
    font-size: 0.95rem;
  }
  .card textarea {
    resize: vertical;
    min-height: 36px;
  }
  .card-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 10px;
    gap: 8px;
  }
  .btn {
    border: none;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.85rem;
    cursor: pointer;
    font-weight: 600;
  }
  .btn-waze {
    background: var(--accent);
    color: #05201c;
    flex: 1;
    text-align: center;
    text-decoration: none;
    display: block;
  }
  .btn-icon {
    background: #101c33;
    color: var(--muted);
    border: 1px solid var(--card-border);
    padding: 8px 10px;
  }
  .btn-danger {
    background: transparent;
    color: var(--danger);
    border: 1px solid var(--danger);
  }
  .reorder {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .add-btn {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: 2px dashed var(--card-border);
    background: transparent;
    color: var(--accent-2);
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  .empty {
    color: var(--muted);
    text-align: center;
    padding: 24px 0;
    font-size: 0.9rem;
  }
</style>
</head>
<body>

<header>
  <input id="tripName" type="text" placeholder="Name des Ausflugs" />
  <input id="tripDate" type="date" />
  <div class="totals">
    <span>🛣️ <span id="totalKm">0</span> km</span>
    <span>⏱️ <span id="totalTime">0h 0min</span></span>
  </div>
</header>

<nav class="tabs">
  <button data-tab="route" class="active">🚗 Route</button>
  <button data-tab="sights">📸 Sehenswürdigkeiten</button>
  <button data-tab="hotels">🏨 Hotels</button>
</nav>

<main>
  <section id="tab-route" class="tab active">
    <div id="stopsList"></div>
    <button class="add-btn" id="addStop">+ Etappe hinzufügen</button>
  </section>

  <section id="tab-sights" class="tab">
    <div id="sightsList"></div>
    <button class="add-btn" id="addSight">+ Sehenswürdigkeit hinzufügen</button>
  </section>

  <section id="tab-hotels" class="tab">
    <div id="hotelsList"></div>
    <button class="add-btn" id="addHotel">+ Hotel hinzufügen</button>
  </section>
</main>

<script>
const STORAGE_KEY = 'roadtripAppData';

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { tripName: '', tripDate: '', stops: [], sights: [], hotels: [] };
}

let state = loadState();

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function wazeUrl(address) {
  return 'https://waze.com/ul?q=' + encodeURIComponent(address || '') + '&navigate=yes';
}

// ---------- header ----------
const tripNameEl = document.getElementById('tripName');
const tripDateEl = document.getElementById('tripDate');
tripNameEl.value = state.tripName || '';
tripDateEl.value = state.tripDate || '';
tripNameEl.addEventListener('input', () => { state.tripName = tripNameEl.value; save(); });
tripDateEl.addEventListener('input', () => { state.tripDate = tripDateEl.value; save(); });

function calcTotals() {
  let km = 0, minutes = 0;
  state.stops.forEach(s => {
    km += parseFloat(s.km) || 0;
    minutes += parseFloat(s.duration) || 0;
  });
  document.getElementById('totalKm').textContent = km % 1 === 0 ? km : km.toFixed(1);
  const h = Math.floor(minutes / 60);
  const m = Math.round(minutes % 60);
  document.getElementById('totalTime').textContent = h + 'h ' + m + 'min';
}

// ---------- tabs ----------
document.querySelectorAll('nav.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

// ---------- generic field update ----------
function updateField(list, id, field, value) {
  const item = list.find(i => i.id === id);
  if (item) item[field] = value;
  save();
}

// ---------- STOPS (Route) ----------
function renderStops() {
  const container = document.getElementById('stopsList');
  container.innerHTML = '';
  if (state.stops.length === 0) {
    container.innerHTML = '<div class="empty">Noch keine Etappen. Füge die erste Station hinzu.</div>';
  }
  state.stops.forEach((stop, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-row">
        <div style="flex:1">
          <label>Adresse (Etappe ${idx + 1})</label>
          <input type="text" data-field="address" placeholder="z. B. Musterstraße 1, Musterstadt" value="${escapeHtml(stop.address || '')}">
        </div>
      </div>
      <div class="card-row two">
        <div>
          <label>Geplante Uhrzeit</label>
          <input type="time" data-field="time" value="${escapeHtml(stop.time || '')}">
        </div>
        <div>
          <label>Km ab vorheriger Etappe</label>
          <input type="number" step="0.1" data-field="km" placeholder="0" value="${stop.km ?? ''}">
        </div>
      </div>
      <div class="card-row two">
        <div>
          <label>Fahrzeit ab vorheriger Etappe (Minuten)</label>
          <input type="number" step="1" data-field="duration" placeholder="0" value="${stop.duration ?? ''}">
        </div>
      </div>
      <div class="card-row">
        <div style="flex:1">
          <label>Notiz</label>
          <textarea data-field="note" placeholder="Notiz...">${escapeHtml(stop.note || '')}</textarea>
        </div>
      </div>
      <div class="card-actions">
        <div class="reorder">
          <button class="btn btn-icon" data-action="up" ${idx === 0 ? 'disabled' : ''}>▲</button>
          <button class="btn btn-icon" data-action="down" ${idx === state.stops.length - 1 ? 'disabled' : ''}>▼</button>
        </div>
        <a class="btn btn-waze" href="${wazeUrl(stop.address)}" target="_blank" rel="noopener">In Waze öffnen</a>
        <button class="btn btn-danger" data-action="delete">Löschen</button>
      </div>
    `;
    card.querySelectorAll('[data-field]').forEach(inp => {
      inp.addEventListener('input', () => {
        updateField(state.stops, stop.id, inp.dataset.field, inp.value);
        if (inp.dataset.field === 'km' || inp.dataset.field === 'duration') calcTotals();
        if (inp.dataset.field === 'address') {
          card.querySelector('.btn-waze').setAttribute('href', wazeUrl(inp.value));
        }
      });
    });
    card.querySelector('[data-action="up"]').addEventListener('click', () => {
      if (idx > 0) {
        [state.stops[idx - 1], state.stops[idx]] = [state.stops[idx], state.stops[idx - 1]];
        save(); renderStops(); calcTotals();
      }
    });
    card.querySelector('[data-action="down"]').addEventListener('click', () => {
      if (idx < state.stops.length - 1) {
        [state.stops[idx + 1], state.stops[idx]] = [state.stops[idx], state.stops[idx + 1]];
        save(); renderStops(); calcTotals();
      }
    });
    card.querySelector('[data-action="delete"]').addEventListener('click', () => {
      state.stops = state.stops.filter(s => s.id !== stop.id);
      save(); renderStops(); calcTotals();
    });
    container.appendChild(card);
  });
}

document.getElementById('addStop').addEventListener('click', () => {
  state.stops.push({ id: uid(), address: '', time: '', km: '', duration: '', note: '' });
  save(); renderStops(); calcTotals();
});

// ---------- SIGHTS ----------
function renderSights() {
  const container = document.getElementById('sightsList');
  container.innerHTML = '';
  if (state.sights.length === 0) {
    container.innerHTML = '<div class="empty">Noch keine Sehenswürdigkeiten eingetragen.</div>';
  }
  state.sights.forEach(sight => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-row">
        <div style="flex:1">
          <label>Name</label>
          <input type="text" data-field="name" placeholder="Name des Ortes" value="${escapeHtml(sight.name || '')}">
        </div>
      </div>
      <div class="card-row">
        <div style="flex:1">
          <label>Adresse</label>
          <input type="text" data-field="address" placeholder="Adresse" value="${escapeHtml(sight.address || '')}">
        </div>
      </div>
      <div class="card-row">
        <div style="flex:1">
          <label>Notiz (z. B. Öffnungszeiten, Eintritt)</label>
          <textarea data-field="note" placeholder="Notiz...">${escapeHtml(sight.note || '')}</textarea>
        </div>
      </div>
      <div class="card-actions">
        <a class="btn btn-waze" href="${wazeUrl(sight.address)}" target="_blank" rel="noopener">In Waze öffnen</a>
        <button class="btn btn-danger" data-action="delete">Löschen</button>
      </div>
    `;
    card.querySelectorAll('[data-field]').forEach(inp => {
      inp.addEventListener('input', () => {
        updateField(state.sights, sight.id, inp.dataset.field, inp.value);
        if (inp.dataset.field === 'address') {
          card.querySelector('.btn-waze').setAttribute('href', wazeUrl(inp.value));
        }
      });
    });
    card.querySelector('[data-action="delete"]').addEventListener('click', () => {
      state.sights = state.sights.filter(s => s.id !== sight.id);
      save(); renderSights();
    });
    container.appendChild(card);
  });
}

document.getElementById('addSight').addEventListener('click', () => {
  state.sights.push({ id: uid(), name: '', address: '', note: '' });
  save(); renderSights();
});

// ---------- HOTELS ----------
function renderHotels() {
  const container = document.getElementById('hotelsList');
  container.innerHTML = '';
  if (state.hotels.length === 0) {
    container.innerHTML = '<div class="empty">Noch keine Hotels eingetragen.</div>';
  }
  state.hotels.forEach(hotel => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-row">
        <div style="flex:1">
          <label>Name</label>
          <input type="text" data-field="name" placeholder="Hotelname" value="${escapeHtml(hotel.name || '')}">
        </div>
      </div>
      <div class="card-row">
        <div style="flex:1">
          <label>Adresse</label>
          <input type="text" data-field="address" placeholder="Adresse" value="${escapeHtml(hotel.address || '')}">
        </div>
      </div>
      <div class="card-row two">
        <div>
          <label>Check-in</label>
          <input type="date" data-field="checkin" value="${escapeHtml(hotel.checkin || '')}">
        </div>
        <div>
          <label>Check-out</label>
          <input type="date" data-field="checkout" value="${escapeHtml(hotel.checkout || '')}">
        </div>
      </div>
      <div class="card-row two">
        <div>
          <label>Preis</label>
          <input type="text" data-field="price" placeholder="z. B. 120€" value="${escapeHtml(hotel.price || '')}">
        </div>
        <div>
          <label>Buchungsnummer</label>
          <input type="text" data-field="bookingNumber" placeholder="Buchungsnr." value="${escapeHtml(hotel.bookingNumber || '')}">
        </div>
      </div>
      <div class="card-row">
        <div style="flex:1">
          <label>Notiz</label>
          <textarea data-field="note" placeholder="Notiz...">${escapeHtml(hotel.note || '')}</textarea>
        </div>
      </div>
      <div class="card-actions">
        <a class="btn btn-waze" href="${wazeUrl(hotel.address)}" target="_blank" rel="noopener">In Waze öffnen</a>
        <button class="btn btn-danger" data-action="delete">Löschen</button>
      </div>
    `;
    card.querySelectorAll('[data-field]').forEach(inp => {
      inp.addEventListener('input', () => {
        updateField(state.hotels, hotel.id, inp.dataset.field, inp.value);
        if (inp.dataset.field === 'address') {
          card.querySelector('.btn-waze').setAttribute('href', wazeUrl(inp.value));
        }
      });
    });
    card.querySelector('[data-action="delete"]').addEventListener('click', () => {
      state.hotels = state.hotels.filter(h => h.id !== hotel.id);
      save(); renderHotels();
    });
    container.appendChild(card);
  });
}

document.getElementById('addHotel').addEventListener('click', () => {
  state.hotels.push({ id: uid(), name: '', address: '', checkin: '', checkout: '', price: '', bookingNumber: '', note: '' });
  save(); renderHotels();
});

// ---------- utils ----------
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// ---------- init ----------
renderStops();
renderSights();
renderHotels();
calcTotals();

// ---------- service worker ----------
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
