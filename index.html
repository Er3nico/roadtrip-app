<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roadtrip App</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b998b">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #0f172a;
    --card: #1a2740;
    --card-border: #2a3a5c;
    --text: #e2e8f0;
    --muted: #93a3b8;
    --accent: #1b998b;
    --accent-2: #2dd4bf;
    --danger: #f2545b;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
  }
  .bottomnav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 15;
    display: flex;
    gap: 4px;
    background: rgba(15, 23, 42, 0.96);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--card-border);
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
  }
  .bottomnav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    background: transparent;
    border: none;
    color: var(--muted);
    padding: 8px 4px;
    border-radius: 10px;
    font-size: 0.68rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .bottomnav-icon {
    font-size: 1.3rem;
    line-height: 1;
  }
  .bottomnav-item.active {
    color: var(--accent-2);
  }
  .bottomnav-item:active {
    transform: scale(0.95);
  }
  .appbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    background: rgba(15, 23, 42, 0.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--card-border);
  }
  .icon-btn {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--text);
    border-radius: 10px;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.1s ease, background 0.15s ease;
  }
  .icon-btn:active {
    transform: scale(0.94);
  }
  .icon-btn:hover {
    background: #101c33;
  }
  .appbar-title {
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 0.2px;
  }
  .drawer-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s ease, visibility 0.25s ease;
    z-index: 29;
  }
  .drawer-overlay.open {
    opacity: 1;
    visibility: visible;
  }
  .drawer {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: min(300px, 82vw);
    background: var(--card);
    border-right: 1px solid var(--card-border);
    transform: translateX(-100%);
    transition: transform 0.28s cubic-bezier(.4,0,.2,1);
    z-index: 30;
    display: flex;
    flex-direction: column;
    padding: 20px 0;
    overflow-y: auto;
  }
  .drawer.open {
    transform: translateX(0);
    box-shadow: 10px 0 30px rgba(0, 0, 0, 0.4);
  }
  .drawer-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 20px 18px;
    border-bottom: 1px solid var(--card-border);
    margin-bottom: 12px;
  }
  .drawer-logo {
    font-size: 1.8rem;
    line-height: 1;
  }
  .drawer-title {
    font-weight: 700;
    font-size: 1.05rem;
  }
  .drawer-subtitle {
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 2px;
  }
  .drawer-nav {
    display: flex;
    flex-direction: column;
    padding: 0 10px;
    gap: 2px;
  }
  .drawer-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: transparent;
    border: none;
    color: var(--text);
    padding: 12px 12px;
    border-radius: 10px;
    font-size: 0.95rem;
    text-align: left;
    cursor: pointer;
    width: 100%;
    font-family: inherit;
  }
  .drawer-item .drawer-item-icon {
    font-size: 1.1rem;
    width: 22px;
    text-align: center;
    flex-shrink: 0;
  }
  .drawer-item:hover {
    background: rgba(255, 255, 255, 0.05);
  }
  .drawer-item.active {
    background: var(--accent);
    color: #05201c;
    font-weight: 700;
  }
  .drawer-item-danger {
    color: var(--danger);
  }
  .drawer-item-danger:hover {
    background: rgba(242, 84, 91, 0.12);
  }
  .drawer-divider {
    height: 1px;
    background: var(--card-border);
    margin: 12px 20px;
  }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s ease, visibility 0.2s ease;
    z-index: 40;
  }
  .modal-overlay.open {
    opacity: 1;
    visibility: visible;
  }
  .modal-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 24px;
    max-width: 340px;
    width: 100%;
  }
  .modal-card h2 {
    margin: 0 0 12px;
    font-size: 1.2rem;
  }
  .modal-card p {
    margin: 0 0 10px;
    font-size: 0.9rem;
    line-height: 1.5;
  }
  .modal-muted {
    color: var(--muted) !important;
    font-size: 0.8rem !important;
  }
  .modal-card .btn {
    width: 100%;
    margin-top: 10px;
  }
  .trip-header {
    padding: 4px 16px 14px;
  }
  .trip-header input[type="text"], .trip-header input[type="date"] {
    background: transparent;
    border: none;
    color: var(--text);
    font-weight: 700;
    width: 100%;
    padding: 4px 0;
  }
  #tripName {
    font-size: 1.4rem;
  }
  #tripDate {
    font-size: 0.9rem;
    color: var(--muted);
  }
  .totals {
    display: flex;
    gap: 16px;
    margin-top: 8px;
    font-size: 0.85rem;
    color: var(--accent-2);
    font-weight: 600;
  }
  main {
    padding: 0 16px calc(84px + env(safe-area-inset-bottom, 0px));
  }
  .tab { display: none; }
  .tab.active { display: block; }
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .card-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .card-row.two > * { flex: 1; min-width: 0; }
  .card label {
    display: block;
    font-size: 0.7rem;
    color: var(--muted);
    margin-bottom: 3px;
  }
  .card input, .card textarea {
    width: 100%;
    background: #101c33;
    border: 1px solid var(--card-border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px;
    font-size: 0.95rem;
  }
  .card textarea {
    resize: vertical;
    min-height: 36px;
  }
  .card-actions {
    display: flex;
    flex-direction: column;
    margin-top: 10px;
    gap: 8px;
  }
  .card-actions-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .card-actions-row.end {
    justify-content: flex-end;
  }
  .reorder-h {
    display: flex;
    gap: 6px;
  }
  .btn {
    border: none;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.85rem;
    cursor: pointer;
    font-weight: 600;
  }
  .btn-waze {
    background: var(--accent);
    color: #05201c;
    flex: 1;
    text-align: center;
    text-decoration: none;
    display: block;
  }
  .btn-icon {
    background: #101c33;
    color: var(--muted);
    border: 1px solid var(--card-border);
    padding: 8px 10px;
  }
  .btn-danger {
    background: transparent;
    color: var(--danger);
    border: 1px solid var(--danger);
  }
  .add-btn {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: 2px dashed var(--card-border);
    background: transparent;
    color: var(--accent-2);
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  .empty {
    color: var(--muted);
    text-align: center;
    padding: 24px 0;
    font-size: 0.9rem;
  }
  .map-toggle-btn {
    background: transparent;
    border: none;
    color: var(--accent-2);
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    padding: 2px 0 10px;
    text-align: left;
    font-family: inherit;
  }
  .map-frame {
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--card-border);
    margin-bottom: 10px;
    height: 200px;
  }
  .map-frame[hidden] {
    display: none;
  }
  .map-frame iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }
</style>
</head>
<body>

<header class="appbar">
  <button class="icon-btn" id="menuToggle" aria-label="Menü öffnen">☰</button>
  <span class="appbar-title">Roadtrip</span>
</header>

<div class="drawer-overlay" id="drawerOverlay"></div>
<nav class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-header">
    <span class="drawer-logo">🧭</span>
    <div>
      <div class="drawer-title">Roadtrip Planer</div>
      <div class="drawer-subtitle">Deine Reise im Griff</div>
    </div>
  </div>
  <div class="drawer-nav">
    <button class="drawer-item" id="exportBtn"><span class="drawer-item-icon">📤</span><span>Trip exportieren</span></button>
    <button class="drawer-item" id="importBtn"><span class="drawer-item-icon">📥</span><span>Trip importieren</span></button>
    <button class="drawer-item drawer-item-danger" id="clearBtn"><span class="drawer-item-icon">🗑️</span><span>Alle Daten löschen</span></button>
  </div>
  <div class="drawer-divider"></div>
  <div class="drawer-nav">
    <button class="drawer-item" id="aboutBtn"><span class="drawer-item-icon">ℹ️</span><span>Über die App</span></button>
  </div>
  <input type="file" id="importFile" accept="application/json" hidden>
</nav>

<div class="modal-overlay" id="aboutOverlay">
  <div class="modal-card">
    <h2>🧭 Roadtrip Planer</h2>
    <p>Plane Routen, Sehenswürdigkeiten und Hotels für deinen nächsten Ausflug – inklusive direkter Waze-Navigation pro Eintrag.</p>
    <p class="modal-muted">Alle Daten werden ausschließlich lokal auf diesem Gerät gespeichert.</p>
    <button class="btn btn-waze" id="aboutClose">Schließen</button>
  </div>
</div>

<main>
  <section class="trip-header">
    <input id="tripName" type="text" placeholder="Name des Ausflugs" />
    <input id="tripDate" type="date" />
    <div class="totals">
      <span>🛣️ <span id="totalKm">0</span> km</span>
      <span>⏱️ <span id="totalTime">0h 0min</span></span>
    </div>
  </section>

  <section id="tab-route" class="tab active">
    <div id="stopsList"></div>
    <button class="add-btn" id="addStop">+ Etappe hinzufügen</button>
  </section>

  <section id="tab-sights" class="tab">
    <div id="sightsList"></div>
    <button class="add-btn" id="addSight">+ Sehenswürdigkeit hinzufügen</button>
  </section>

  <section id="tab-hotels" class="tab">
    <div id="hotelsList"></div>
    <button class="add-btn" id="addHotel">+ Hotel hinzufügen</button>
  </section>
</main>

<nav class="bottomnav">
  <button data-tab="route" class="bottomnav-item active"><span class="bottomnav-icon">🚗</span><span>Route</span></button>
  <button data-tab="sights" class="bottomnav-item"><span class="bottomnav-icon">📸</span><span>Sehenswürdigkeiten</span></button>
  <button data-tab="hotels" class="bottomnav-item"><span class="bottomnav-icon">🏨</span><span>Hotels</span></button>
</nav>

<script>
const STORAGE_KEY = 'roadtripAppData';

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { tripName: '', tripDate: '', stops: [], sights: [], hotels: [] };
}

let state = loadState();

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function wazeUrl(address) {
  return 'https://waze.com/ul?q=' + encodeURIComponent(address || '') + '&navigate=yes';
}

// ---------- header ----------
const tripNameEl = document.getElementById('tripName');
const tripDateEl = document.getElementById('tripDate');
tripNameEl.value = state.tripName || '';
tripDateEl.value = state.tripDate || '';
tripNameEl.addEventListener('input', () => { state.tripName = tripNameEl.value; save(); });
tripDateEl.addEventListener('input', () => { state.tripDate = tripDateEl.value; save(); });

function calcTotals() {
  let km = 0, minutes = 0;
  state.stops.forEach(s => {
    km += parseFloat(s.km) || 0;
    minutes += parseFloat(s.duration) || 0;
  });
  document.getElementById('totalKm').textContent = km % 1 === 0 ? km : km.toFixed(1);
  const h = Math.floor(minutes / 60);
  const m = Math.round(minutes % 60);
  document.getElementById('totalTime').textContent = h + 'h ' + m + 'min';
}

// ---------- tabs ----------
document.querySelectorAll('.bottomnav-item[data-tab]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.bottomnav-item[data-tab]').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

// ---------- drawer ----------
const drawer = document.getElementById('drawer');
const drawerOverlay = document.getElementById('drawerOverlay');

function openDrawer() {
  drawer.classList.add('open');
  drawerOverlay.classList.add('open');
  drawer.setAttribute('aria-hidden', 'false');
}
function closeDrawer() {
  drawer.classList.remove('open');
  drawerOverlay.classList.remove('open');
  drawer.setAttribute('aria-hidden', 'true');
}
document.getElementById('menuToggle').addEventListener('click', openDrawer);
drawerOverlay.addEventListener('click', closeDrawer);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeDrawer(); closeAbout(); }
});

// ---------- about modal ----------
const aboutOverlay = document.getElementById('aboutOverlay');
function openAbout() { aboutOverlay.classList.add('open'); }
function closeAbout() { aboutOverlay.classList.remove('open'); }
document.getElementById('aboutBtn').addEventListener('click', () => { closeDrawer(); openAbout(); });
document.getElementById('aboutClose').addEventListener('click', closeAbout);
aboutOverlay.addEventListener('click', (e) => { if (e.target === aboutOverlay) closeAbout(); });

// ---------- export / import ----------
document.getElementById('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const safeName = (state.tripName || 'roadtrip').trim().replace(/[^a-z0-9äöüß_-]+/gi, '-').toLowerCase() || 'roadtrip';
  a.href = url;
  a.download = safeName + '-backup.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  closeDrawer();
});

const importFile = document.getElementById('importFile');
document.getElementById('importBtn').addEventListener('click', () => importFile.click());
importFile.addEventListener('change', () => {
  const file = importFile.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      state = {
        tripName: data.tripName || '',
        tripDate: data.tripDate || '',
        stops: Array.isArray(data.stops) ? data.stops : [],
        sights: Array.isArray(data.sights) ? data.sights : [],
        hotels: Array.isArray(data.hotels) ? data.hotels : []
      };
      save();
      tripNameEl.value = state.tripName;
      tripDateEl.value = state.tripDate;
      renderStops(); renderSights(); renderHotels(); calcTotals();
      closeDrawer();
    } catch (e) {
      alert('Diese Datei konnte nicht gelesen werden. Bitte eine gültige Roadtrip-Backup-Datei (JSON) wählen.');
    }
    importFile.value = '';
  };
  reader.readAsText(file);
});

document.getElementById('clearBtn').addEventListener('click', () => {
  if (!confirm('Wirklich alle Daten löschen? Route, Sehenswürdigkeiten und Hotels werden unwiderruflich entfernt.')) return;
  state = { tripName: '', tripDate: '', stops: [], sights: [], hotels: [] };
  save();
  tripNameEl.value = '';
  tripDateEl.value = '';
  renderStops(); renderSights(); renderHotels(); calcTotals();
  closeDrawer();
});

// ---------- address map preview ----------
function wireMapToggle(card) {
  const btn = card.querySelector('[data-action="toggle-map"]');
  const frame = card.querySelector('.map-frame');
  const iframe = frame.querySelector('iframe');
  const addressInput = card.querySelector('[data-field="address"]');
  let debounceTimer;
  function updateMapSrc() {
    const addr = addressInput.value.trim();
    iframe.src = addr ? 'https://maps.google.com/maps?q=' + encodeURIComponent(addr) + '&z=15&output=embed' : '';
  }
  btn.addEventListener('click', () => {
    if (frame.hasAttribute('hidden')) {
      frame.removeAttribute('hidden');
      btn.textContent = '🗺️ Karte ausblenden';
      updateMapSrc();
    } else {
      frame.setAttribute('hidden', '');
      btn.textContent = '🗺️ Auf Karte prüfen';
    }
  });
  addressInput.addEventListener('input', () => {
    if (frame.hasAttribute('hidden')) return;
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(updateMapSrc, 700);
  });
}

// ---------- generic field update ----------
function updateField(list, id, field, value) {
  const item = list.find(i => i.id === id);
  if (item) item[field] = value;
  save();
}

// ---------- STOPS (Route) ----------
function renderStops() {
  const container = document.getElementById('stopsList');
  container.innerHTML = '';
  if (state.stops.length === 0) {
    container.innerHTML = '<div class="empty">Noch keine Etappen. Füge die erste Station hinzu.</div>';
  }
  state.stops.forEach((stop, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-row">
        <div style="flex:1">
          <label>Adresse (Etappe ${idx + 1})</label>
          <input type="text" data-field="address" placeholder="z. B. Musterstraße 1, Musterstadt" value="${escapeHtml(stop.address || '')}">
        </div>
      </div>
      <button type="button" class="map-toggle-btn" data-action="toggle-map">🗺️ Auf Karte prüfen</button>
      <div class="map-frame" hidden><iframe loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div>
      <div class="card-row two">
        <div>
          <label>Geplante Uhrzeit</label>
          <input type="time" data-field="time" value="${escapeHtml(stop.time || '')}">
        </div>
        <div>
          <label>Km ab vorheriger Etappe</label>
          <input type="number" step="0.1" data-field="km" placeholder="0" value="${stop.km ?? ''}">
        </div>
      </div>
      <div class="card-row two">
        <div>
          <label>Fahrzeit ab vorheriger Etappe (Minuten)</label>
          <input type="number" step="1" data-field="duration" placeholder="0" value="${stop.duration ?? ''}">
        </div>
      </div>
      <div class="card-row">
        <div style="flex:1">
          <label>Notiz</label>
          <textarea data-field="note" placeholder="Notiz...">${escapeHtml(stop.note || '')}</textarea>
        </div>
      </div>
      <div class="card-actions">
        <a class="btn btn-waze" href="${wazeUrl(stop.address)}" target="_blank" rel="noopener">In Waze öffnen</a>
        <div class="card-actions-row">
          <div class="reorder-h">
            <button class="btn btn-icon" data-action="up" ${idx === 0 ? 'disabled' : ''}>▲</button>
            <button class="btn btn-icon" data-action="down" ${idx === state.stops.length - 1 ? 'disabled' : ''}>▼</button>
          </div>
          <button class="btn btn-danger" data-action="delete">Löschen</button>
        </div>
      </div>
    `;
    card.querySelectorAll('[data-field]').forEach(inp => {
      inp.addEventListener('input', () => {
        updateField(state.stops, stop.id, inp.dataset.field, inp.value);
        if (inp.dataset.field === 'km' || inp.dataset.field === 'duration') calcTotals();
        if (inp.dataset.field === 'address') {
          card.querySelector('.btn-waze').setAttribute('href', wazeUrl(inp.value));
        }
      });
    });
    card.querySelector('[data-action="up"]').addEventListener('click', () => {
      if (idx > 0) {
        [state.stops[idx - 1], state.stops[idx]] = [state.stops[idx], state.stops[idx - 1]];
        save(); renderStops(); calcTotals();
      }
    });
    card.querySelector('[data-action="down"]').addEventListener('click', () => {
      if (idx < state.stops.length - 1) {
        [state.stops[idx + 1], state.stops[idx]] = [state.stops[idx], state.stops[idx + 1]];
        save(); renderStops(); calcTotals();
      }
    });
    card.querySelector('[data-action="delete"]').addEventListener('click', () => {
      state.stops = state.stops.filter(s => s.id !== stop.id);
      save(); renderStops(); calcTotals();
    });
    wireMapToggle(card);
    container.appendChild(card);
  });
}

document.getElementById('addStop').addEventListener('click', () => {
  state.stops.push({ id: uid(), address: '', time: '', km: '', duration: '', note: '' });
  save(); renderStops(); calcTotals();
});

// ---------- SIGHTS ----------
function renderSights() {
  const container = document.getElementById('sightsList');
  container.innerHTML = '';
  if (state.sights.length === 0) {
    container.innerHTML = '<div class="empty">Noch keine Sehenswürdigkeiten eingetragen.</div>';
  }
  state.sights.forEach(sight => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-row">
        <div style="flex:1">
          <label>Name</label>
          <input type="text" data-field="name" placeholder="Name des Ortes" value="${escapeHtml(sight.name || '')}">
        </div>
      </div>
      <div class="card-row">
        <div style="flex:1">
          <label>Adresse</label>
          <input type="text" data-field="address" placeholder="Adresse" value="${escapeHtml(sight.address || '')}">
        </div>
      </div>
      <button type="button" class="map-toggle-btn" data-action="toggle-map">🗺️ Auf Karte prüfen</button>
      <div class="map-frame" hidden><iframe loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div>
      <div class="card-row">
        <div style="flex:1">
          <label>Notiz (z. B. Öffnungszeiten, Eintritt)</label>
          <textarea data-field="note" placeholder="Notiz...">${escapeHtml(sight.note || '')}</textarea>
        </div>
      </div>
      <div class="card-actions">
        <a class="btn btn-waze" href="${wazeUrl(sight.address)}" target="_blank" rel="noopener">In Waze öffnen</a>
        <div class="card-actions-row end">
          <button class="btn btn-danger" data-action="delete">Löschen</button>
        </div>
      </div>
    `;
    card.querySelectorAll('[data-field]').forEach(inp => {
      inp.addEventListener('input', () => {
        updateField(state.sights, sight.id, inp.dataset.field, inp.value);
        if (inp.dataset.field === 'address') {
          card.querySelector('.btn-waze').setAttribute('href', wazeUrl(inp.value));
        }
      });
    });
    card.querySelector('[data-action="delete"]').addEventListener('click', () => {
      state.sights = state.sights.filter(s => s.id !== sight.id);
      save(); renderSights();
    });
    wireMapToggle(card);
    container.appendChild(card);
  });
}

document.getElementById('addSight').addEventListener('click', () => {
  state.sights.push({ id: uid(), name: '', address: '', note: '' });
  save(); renderSights();
});

// ---------- HOTELS ----------

  }

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-row">
        <div style="flex:1">

        </div>
      </div>
      <div class="card-row">
        <div style="flex:1">
          <label>Adresse</label>
          <input type="text" data-field="address" placeholder="Adresse" value="${escapeHtml(hotel.address || '')}">

        <div>

          <input type="date" data-field="checkout" value="${escapeHtml(hotel.checkout || '')}">

      </div>
      <div class="card-row two">
        <div>
          <label>Preis</label>

        </div>
        <div>
          <label>Buchungsnummer</label>
          <input type="text" data-field="bookingNumber" placeholder="Buchungsnr." value="${escapeHtml(hotel.bookingNumber || '')}">
        </div>
      </div>

        <div style="flex:1">
          <label>Notiz</label>
          <textarea data-field="note" placeholder="Notiz...">${escapeHtml(hotel.note || '')}</textarea>
        </div>
      </div>
      <div class="card-actions">
        <a class="btn btn-waze" href="${wazeUrl(hotel.address)}" target="_blank" rel="noopener">In Waze öffnen</a>
        <div class="card-actions-row end">
          <button class="btn btn-danger" data-action="delete">Löschen</button>
        </div>
      </div>
    `;
    card.querySelectorAll('[data-field]').forEach(inp => {
      inp.addEventListener('input', () => {
        updateField(state.hotels, hotel.id, inp.dataset.field, inp.value);
        if (inp.dataset.field === 'address') {
          card.querySelector('.btn-waze').setAttribute('href', wazeUrl(inp.value));
        }
      });
    });
    card.querySelector('[data-action="delete"]').addEventListener('click', () => {
      state.hotels = state.hotels.filter(h => h.id !== hotel.id);
      save(); renderHotels();
    });
    wireMapToggle(card);
    container.appendChild(card);
  });
}

document.getElementById('addHotel').addEventListener('click', () => {
  state.hotels.push({ id: uid(), name: '', address: '', checkin: '', checkout: '', price: '', bookingNumber: '', note: '' });
  save(); renderHotels();
});

// ---------- utils ----------
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// ---------- init ----------
renderStops();
renderSights();
renderHotels();
calcTotals();

// ---------- service worker ----------
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
